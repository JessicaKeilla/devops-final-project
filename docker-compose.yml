version: "3.8"

services:

  app:
    build: ./app
    ports:
      - "5000:5000"
    logging:
      driver: json-file

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - loki